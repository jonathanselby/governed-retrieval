name: bootstrap-release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish V0.1 source and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release /tmp/generated
          base64 -d .bootstrap/release.b64 > /tmp/release.tar.gz
          tar -xzf /tmp/release.tar.gz -C /tmp/release
          cp /tmp/release/generated/EDD.md /tmp/generated/EDD.md
          cp /tmp/release/generated/COMPARISON.md /tmp/generated/COMPARISON.md
          rm -rf /tmp/release/generated

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/release/. .
          git add -A
          git commit -m "Publish V0.1 Garage-standard implementation"
          git push origin HEAD:main

          code_sha=$(git rev-parse HEAD)
          mkdir -p generated
          sed "s/__EVIDENCE_COMMIT__/${code_sha}/g" /tmp/generated/EDD.md > generated/EDD.md
          sed "s/__EVIDENCE_COMMIT__/${code_sha}/g" /tmp/generated/COMPARISON.md > generated/COMPARISON.md
          git add generated
          git commit -m "Add code-derived design evidence"
          git push origin HEAD:main
