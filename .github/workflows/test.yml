name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race ./...
      - name: Build
        run: go build -o ./bin/gretrieve ./cmd/gretrieve
      - name: Version contract
        run: test "$(./bin/gretrieve -version)" = "gretrieve 0.1.0"
      - name: Linux arm64 build
        run: GOOS=linux GOARCH=arm64 go build -o ./bin/gretrieve-linux-arm64 ./cmd/gretrieve
      - name: Bafflewick acceptance
        shell: bash
        run: |
          out=$(./bin/gretrieve -corpus examples/bafflewick/corpus.json -caller examples/bafflewick/caller.json -query "insurer hotline")
          echo "$out" | grep -q '"refused":false'
          echo "$out" | grep -q 'runbook.md'
